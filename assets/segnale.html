<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeSafe · Segnale</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<!-- Monitor rivolto al marciapiede: nessun controllo. Doppio clic = schermo intero. -->
<body data-page="segnale" class="segnale RIPOSO">
  <div class="leds"></div>

  <!-- RIPOSO: logo e conteggi -->
  <main class="idle">
    <div class="sg-brand">
      <svg class="sg-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#besafe-logo"/></svg>
      <span class="sg-name">Be<b>Safe</b></span>
    </div>
    <div class="sg-counts">
      <div class="sg-row"><span class="sg-label">Pedoni</span><ul class="sg-dirs" id="dirs-pedone"></ul></div>
      <div class="sg-row"><span class="sg-label">Ciclisti</span><ul class="sg-dirs" id="dirs-ciclista"></ul></div>
    </div>
  </main>

  <!-- ATTENZIONE / PERICOLO -->
  <main class="alert">
    <svg class="triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 3 2 20.5h20L12 3z"/><path d="M12 9.5v5"/><circle cx="12" cy="17.4" r="0.6" fill="currentColor"/>
    </svg>
    <div class="title" id="title">WARNING</div>
    <div class="subtitle" id="subtitle">Veicolo in arrivo</div>
  </main>

  <div class="corner"><span class="dot" id="dot"></span><span id="mode"></span></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="besafe-logo" viewBox="0 0 64 64">
      <path d="M32 3 8 11.5v18.2C8 44.6 18.2 56.6 32 61c13.8-4.4 24-16.4 24-31.3V11.5L32 3z" fill="#16A34A"/>
      <path d="M32 7.6 12 14.7v15C12 42.4 20.6 52.6 32 56.6c11.4-4 20-14.2 20-26.9v-15L32 7.6z" fill="#22C55E"/>
      <g fill="#fff"><rect x="17" y="43" width="6" height="3.2" rx="1"/><rect x="26" y="43" width="6" height="3.2" rx="1"/><rect x="35" y="43" width="6" height="3.2" rx="1"/><rect x="44" y="43" width="3.5" height="3.2" rx="1"/><circle cx="33.5" cy="16" r="3.4"/></g>
      <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M32.4 21.6 30 31.5"/><path d="M30 31.5l-4.4 7.6"/><path d="M30 31.5l5.2 3.4 1.6 4.8"/><path d="M24.8 27.6l4.6-5.2h4.6l3.8 4.6"/></g>
    </symbol>
  </svg>

  <script src="libs/socket.io.min.js"></script>
  <script src="libs/arduino.js"></script>
  <script src="app.js"></script>
</body>
</html>
